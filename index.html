<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ShadeSeat — Dodge the Sun</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#e4572e" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="map-container"></div>

<aside class="sidebar">
  <div class="sidebar-content" id="sidebar-content" style="view-transition-name: sidebar-content;">
    
    <div class="brand" style="justify-content: space-between; width: 100%;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">ShadeSeat</div>
          <div class="brand-tag">Dodge the sun, enjoy the ride.</div>
        </div>
      </div>
      <button type="button" id="install-app-btn" class="install-btn">⬇ Install App</button>
    </div>

    <!-- MAIN FORM VIEW -->
    <div id="form-view">
      <form id="trip-form">
        <div class="field-group">
          
          <!-- FROM -->
          <div class="field">
            <label for="from-input">From</label>
            <input type="text" id="from-input" placeholder="City, station, or address" autocomplete="off" required />
            <div class="autocomplete" id="from-suggest" hidden></div>
            <div class="field-actions">
              <button type="button" class="link-btn" id="use-location-btn">◎ Use my location</button>
              <button type="button" class="link-btn" id="pick-from-btn">📍 Pick on map</button>
              <button type="button" class="link-btn" id="bus-from-btn">🚌 Nearby bus stands</button>
            </div>
            <div class="nearby-list hidden" id="from-bus-list"></div>
          </div>
          
          <button type="button" class="swap-btn" id="swap-btn" title="Swap origin and destination" aria-label="Swap origin and destination">⇄</button>
          
          <!-- TO -->
          <div class="field" style="margin-top: 24px;">
            <label for="to-input">To</label>
            <input type="text" id="to-input" placeholder="City, station, or address" autocomplete="off" required />
            <div class="autocomplete" id="to-suggest" hidden></div>
            <div class="field-actions">
              <button type="button" class="link-btn" id="pick-to-btn">📍 Pick on map</button>
              <button type="button" class="link-btn" id="bus-to-btn">🚌 Nearby bus stands</button>
            </div>
            <div class="nearby-list hidden" id="to-bus-list"></div>
          </div>

        </div>

        <div class="field-group">
          <div class="row">
            <div class="field">
              <label for="date-input">Date</label>
              <input type="date" id="date-input" required />
            </div>
            <div class="field">
              <label for="time-input">Time</label>
              <input type="time" id="time-input" required />
            </div>
          </div>
          <div class="field" style="margin-top: 12px;">
            <label for="mode-input">Travel Mode</label>
            <select id="mode-input">
              <option value="bus">Bus</option>
              <option value="car">Car</option>
            </select>
          </div>
        </div>

        <div class="error-banner" id="error-banner"></div>
        <button type="submit" class="btn-primary" id="submit-btn">Find my shade →</button>
      </form>
    </div>

    <!-- LOADING VIEW -->
    <div id="loading-view" class="loading hidden">
      <div class="sun-spin" aria-hidden="true"></div>
      <span id="loading-text">Tracing routes and tracking the sun…</span>
    </div>

    <!-- RESULTS VIEW -->
    <div id="results-view" class="hidden">
      <button type="button" class="btn-ghost" id="back-btn" style="margin-bottom: 20px; padding: 8px 16px;">← Edit Trip</button>
      
      <div class="verdict-banner" id="verdict-banner">
        <div class="vb-label">Recommendation</div>
        <div class="vb-main" id="vb-main">—</div>
        <div class="vb-sub" id="vb-sub">—</div>
      </div>

      <div class="seat-toggle" role="group" aria-label="Which side has 2 seats">
        <button type="button" id="layout-unknown" class="active">Symmetric</button>
        <button type="button" id="layout-left2">2-Seat Left</button>
        <button type="button" id="layout-right2">2-Seat Right</button>
      </div>
      
      <div class="bus">
        <div class="bus-side" id="side-left">
          <div class="bs-label" id="label-left">Left</div>
          <div class="bs-time mono" id="time-left">0m</div>
          <div class="seat-row" id="seats-left"></div>
        </div>
        <div class="bus-side" id="side-right">
          <div class="bs-label" id="label-right">Right</div>
          <div class="bs-time mono" id="time-right">0m</div>
          <div class="seat-row" id="seats-right"></div>
        </div>
      </div>

      <div class="field-group" style="margin-top: 24px; padding: 12px 16px;">
        <div class="field" style="margin: 0;">
          <label for="pref-select">Sun tolerance</label>
          <select id="pref-select">
            <option value="hot">I run hot — flag any sun</option>
            <option value="normal" selected>Normal</option>
            <option value="mild">I don't mind a little sun</option>
          </select>
        </div>
      </div>

      <h3 class="section-title" style="margin-top: 24px; font-size: 1.05rem;">Route options</h3>
      <div class="route-grid" id="route-grid"></div>
      
    </div>

  </div>
</aside>

<script src="js/app.js"></script>
</body>
</html>
